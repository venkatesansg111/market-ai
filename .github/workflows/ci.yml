name: CI — Trading Terminal

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────────
  # Python Platform Tests (Phases 1–10)
  # ──────────────────────────────────────────────────
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest tests/ -q --tb=short

  # ──────────────────────────────────────────────────
  # .NET Backend Tests (Phase 11)
  # ──────────────────────────────────────────────────
  backend-tests:
    name: .NET Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/Trading.slnx

      - name: Build
        run: dotnet build backend/Trading.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test backend/Trading.slnx --no-restore --no-build --configuration Release --logger trx --results-directory TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: TestResults/*.trx

  # ──────────────────────────────────────────────────
  # React Frontend Tests (Phase 11)
  # ──────────────────────────────────────────────────
  frontend-tests:
    name: React Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/trading-terminal-react
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/trading-terminal-react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check + build
        run: npm run build

      - name: Run tests
        run: npx vitest run

  # ──────────────────────────────────────────────────
  # Docker Build Validation
  # ──────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t trading-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t trading-frontend:ci ./ui/trading-terminal-react
